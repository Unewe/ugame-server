# Any key can be overridden by the environment variable UGAME_<KEY> (dots and hyphens -> _)
# or by the JVM parameter -Dugame.<key>=...

# Server identifier; empty = random UUID at startup
server.id=
# Address that the meta-service will give to the client for connection
server.public-host=193.238.44.107
server.heartbeat-sec=2

udp.host=0.0.0.0
udp.port=7777

redis.uri=redis://localhost:6379

# Simulation
room.tick-rate=30
room.snapshot-every=1
# 0 = by number of cores
room.threads=0
match.duration-sec=120
match.join-timeout-sec=15

# KCP: must match KcpConfig on the Unity side (kcp2k)
kcp.mtu=1200
kcp.no-delay=true
kcp.interval-ms=10
kcp.fast-resend=0
kcp.congestion-window=false
kcp.send-window=32
kcp.receive-window=128
kcp.timeout-ms=10000
kcp.max-connections=5000
kcp.socket-buffer-bytes=4194304