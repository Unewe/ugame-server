server:
  port: 8081

ugame:
  db:
    host: ${UGAME_DB_HOST:localhost}
    port: ${UGAME_DB_PORT:5430}
    name: ${UGAME_DB_NAME:ugame}
    username: ${UGAME_DB_USER:postgres}
    password: ${UGAME_DB_PASSWORD:postgres}
  jwt:
    # Только для разработки! В проде задайте UGAME_JWT_SECRET (Base64, >= 32 байт):
    #   openssl rand -base64 32
    secret: ${UGAME_JWT_SECRET:gTq19YofY0MUuYR50Vm2rdeaybZHByPdbdAwYdlHeAI=}
    issuer: ugame-meta
    access-ttl: 15m
    refresh-ttl: 30d
  matchmaking:
    # 6 для 3×3. Для отладки с одним-двумя клиентами поставьте 1 или 2.
    players-per-match: ${UGAME_PLAYERS_PER_MATCH:1}
    ticket-ttl: 60s
    poll-interval: 500ms
    fallback-server-host: 193.238.44.107
    fallback-server-port: 7777

spring:
  application:
    name: meta-service
  # Неблокирующий драйвер PostgreSQL. Flyway (JDBC) берёт те же ugame.db.* — см. DatabaseMigration.
  r2dbc:
    url: r2dbc:postgresql://${ugame.db.host}:${ugame.db.port}/${ugame.db.name}
    username: ${ugame.db.username}
    password: ${ugame.db.password}
    pool:
      initial-size: 5
      max-size: 20
  data:
    redis:
      host: ${UGAME_REDIS_HOST:localhost}
      port: ${UGAME_REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info
