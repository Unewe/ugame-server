# Любой ключ можно переопределить переменной окружения UGAME_<КЛЮЧ> (точки и дефисы -> _)
# или параметром JVM -Dugame.<ключ>=...

# Идентификатор сервера; пусто = случайный UUID при старте
server.id=
# Адрес, который мета-сервис отдаст клиенту для подключения
server.public-host=127.0.0.1
server.heartbeat-sec=2

udp.host=0.0.0.0
udp.port=7777

redis.uri=redis://localhost:6379

# Симуляция
room.tick-rate=30
room.snapshot-every=1
# 0 = по числу ядер
room.threads=0
match.duration-sec=120
match.join-timeout-sec=15

# KCP: должны совпадать с KcpConfig на стороне Unity (kcp2k)
kcp.mtu=1200
kcp.no-delay=true
kcp.interval-ms=10
kcp.fast-resend=0
kcp.congestion-window=false
kcp.send-window=32
kcp.receive-window=128
kcp.timeout-ms=10000
kcp.max-connections=5000
kcp.socket-buffer-bytes=4194304
